name: Update customized rules

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches: [main]
    paths: [update.py, test_update.py, 'licenses/**', .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: customized-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check customization
        run: python3 -m unittest -v
      - name: Refresh upstream and validate
        run: |
          python3 update.py --update
          python3 update.py
      - name: Publish changed profile
        run: |
          if git diff --quiet -- sr_top500_banlist_ad.conf; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sr_top500_banlist_ad.conf
          git commit -m 'Update customized sr_top500_banlist_ad rules'
          git push origin HEAD:main
